name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
      tdb: ${{ steps.filter.outputs.tdb }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            run:
              - 'landau/**'
              - 'tests/**'
              - 'pyproject.toml'
              - '.github/workflows/tests.yml'
            tdb:
              - 'landau/tdb.py'
              - 'tests/unit/test_tdb.py'
              - 'tests/integration/test_tdb_pycalphad.py'
              - 'pyproject.toml'

  build:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: ["ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Skip notice
      if: needs.changes.outputs.run != 'true'
      run: echo "No source, test, or workflow changes; skipping."
    - uses: actions/checkout@v5
      if: needs.changes.outputs.run == 'true'
    - name: Set up Python ${{ matrix.python-version }}
      if: needs.changes.outputs.run == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Setup
      if: needs.changes.outputs.run == 'true'
      shell: bash -l {0}
      run: |
        pip install -e .[test,constraints,fast-tsp,python-tsp]
    - name: run tests
      if: needs.changes.outputs.run == 'true'
      shell: bash -l {0}
      env:
        HYPOTHESIS_ARTIFACT_NAME: hypothesis-example-db-py${{ matrix.python-version }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pytest -m "not fleche and not pycalphad"
    - name: Upload Hypothesis example database
      if: needs.changes.outputs.run == 'true' && always()
      uses: actions/upload-artifact@v4
      with:
        name: hypothesis-example-db-py${{ matrix.python-version }}
        path: .hypothesis/examples
        if-no-files-found: ignore
        retention-days: 90

  # Own environment: fleche pulls pyiron-snippets>=1.1, which would lift landau's
  # declared >=1 floor in the minimum-deps job if it sat in the `test` extra.
  fleche:
    needs: changes
    runs-on: ubuntu-latest
    steps:
    - name: Skip notice
      if: needs.changes.outputs.run != 'true'
      run: echo "No source, test, or workflow changes; skipping."
    - uses: actions/checkout@v5
      if: needs.changes.outputs.run == 'true'
    - name: Set up Python
      if: needs.changes.outputs.run == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
    - name: Setup
      if: needs.changes.outputs.run == 'true'
      shell: bash -l {0}
      run: |
        pip install -e ".[test,test-fleche]"
    - name: run fleche plugin tests
      if: needs.changes.outputs.run == 'true'
      shell: bash -l {0}
      run: |
        pytest -m fleche

  # Own environment: pycalphad pulls in symengine (about 130 MB installed), so it
  # stays out of the `test` extra. The TDB round trip only guards landau/tdb.py,
  # so it runs when the exporter or its tests change, and on every push to main.
  pycalphad:
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.tdb == 'true' || github.event_name == 'push' }}
    steps:
    - name: Skip notice
      if: env.RUN != 'true'
      run: echo "No TDB export changes; skipping."
    - uses: actions/checkout@v5
      if: env.RUN == 'true'
    - name: Set up Python
      if: env.RUN == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
    - name: Setup
      if: env.RUN == 'true'
      shell: bash -l {0}
      run: |
        pip install -e ".[test,test-pycalphad]"
    - name: run TDB round-trip tests
      if: env.RUN == 'true'
      shell: bash -l {0}
      run: |
        pytest -m pycalphad
